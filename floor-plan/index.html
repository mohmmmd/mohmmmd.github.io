<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>محرر المخططات التفاعلي</title>
<meta name="description" content="أداة لتعديل المخططات المعمارية فوق صورة المخطط مع تثبيت الأعمدة وحساب الأطوال والمساحات تلقائياً.">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#667085; --line:#d9dde4;
  --accent:#0f6e5c; --accent-ink:#ffffff; --accent-soft:#e3f2ee;
  --err:#c62828; --warn:#b26a00; --info:#2563a8;
  --canvas:#fbfbfa; --field:#ffffff; --hover:#eef1f4; --soft:#f7f8fa; --shade:rgba(20,24,32,.45);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14181d; --panel:#1b2027; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2e3540; --accent:#2fa58b; --accent-soft:#1d3a33;
  --canvas:#232930; --field:#12161b; --hover:#252c35; --soft:#20262e; --shade:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14181d; --panel:#1b2027; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2e3540; --accent:#2fa58b; --accent-soft:#1d3a33;
  --canvas:#232930; --field:#12161b; --hover:#252c35; --soft:#20262e; --shade:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",Arial,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
header h1{font-size:15px;margin:0 4px 0 10px;font-weight:700}
.tb{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.btn{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1.2;flex:none}
.btn:hover{background:var(--hover)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dng{color:var(--err)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
main{display:grid;grid-template-columns:1fr 360px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:var(--canvas)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#cv.pan{cursor:grab}
#cv.draw{cursor:crosshair}
aside{background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 0 auto;border:0;background:none;padding:9px 8px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;margin-inline-start:4px}
.pane{display:none;padding:12px;overflow:auto;flex:1}
.pane.on{display:block}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row label{min-width:78px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--field);width:100%;min-width:0}
input[type=number]{direction:ltr;text-align:right}
h3{font-size:14px;margin:14px 0 6px}
h3:first-child{margin-top:0}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kpi div{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px}
.kpi b{display:block;font-size:16px;direction:ltr;text-align:right}
.kpi span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--accent-soft)}
tbody tr{cursor:pointer}
.iss{border:1px solid var(--line);border-inline-start:4px solid var(--info);border-radius:8px;padding:8px;margin:6px 0;cursor:pointer;line-height:1.55}
.iss.err{border-inline-start-color:var(--err)}
.iss.warn{border-inline-start-color:var(--warn)}
.iss .fx{margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:var(--panel)}
.card.on{outline:2px solid var(--accent)}
.card svg{width:100%;height:auto;display:block;background:#fbfbfa;border-radius:6px}
.card .meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
footer{display:flex;gap:14px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);overflow-x:auto;white-space:nowrap}
footer b{color:var(--ink);direction:ltr;display:inline-block}
.toast{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:.95}
.zoom{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:34px;height:34px;padding:0;font-size:17px}
.legend{position:absolute;bottom:10px;right:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;color:var(--muted);line-height:1.6}
.legend i{display:inline-block;width:10px;height:10px;vertical-align:middle;margin-inline-end:4px;border-radius:2px}
.chk{display:flex;gap:6px;align-items:center;margin:5px 0;cursor:pointer}
.chk input{width:16px;height:16px}
.typetbl input{padding:3px 5px}
#modal{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#modal h4{margin:0;font-size:15px;line-height:1.6}
#modal textarea{width:100%;min-height:160px;direction:ltr;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--ink);padding:8px}
#modal img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
#modal .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:56vh auto}
  aside{border-inline-start:0;border-top:1px solid var(--line);max-height:none}
  .app{height:auto;min-height:100vh}
  #stage{height:56vh}
  header h1{display:none}
  .legend{display:none}
}
@media print{
  header,aside,footer,.zoom,.toast{display:none!important}
  main{display:block}
  #stage{height:100vh}
}
</style>
</head>
<body>
<div class="app">
<div id="modal" hidden><div class="box" role="dialog" aria-modal="true"></div></div>
<header>
  <h1>محرر المخططات</h1>
  <div class="tb">
    <button class="btn on" data-mode="select" title="تحديد وتحريك وتغيير المقاسات (V)">تحديد</button>
    <button class="btn" data-mode="room" title="ارسم غرفة بالسحب (R)">+ غرفة</button>
    <button class="btn" data-mode="column" title="ضع عموداً بالنقر (C)">+ عمود</button>
    <button class="btn" data-mode="pan" title="تحريك اللوحة (H)">تحريك اللوحة</button>
    <select id="newType" title="نوع الغرفة الجديدة" style="width:auto"></select>
  </div>
  <div class="sep"></div>
  <div class="tb">
    <button class="btn" id="bUndo" title="تراجع (Ctrl+Z)">↶</button>
    <button class="btn" id="bRedo" title="إعادة (Ctrl+Y)">↷</button>
  </div>
  <div class="sep"></div>
  <div class="tb">
    <label class="btn" title="ارفع صورة المخطط كخلفية للتتبع">رفع صورة المخطط<input type="file" id="fImg" accept="image/*" hidden></label>
    <button class="btn" data-mode="calib" title="انقر نقطتين معلومتين ثم أدخل الطول الحقيقي">معايرة المقياس</button>
    <button class="btn" data-mode="align" title="انقر نقطة في الصورة وحدد إحداثياتها">مطابقة نقطة</button>
    <button class="btn" data-mode="bgmove" title="اسحب الصورة لضبط موضعها">تحريك الصورة</button>
  </div>
  <div class="sep"></div>
  <div class="tb">
    <button class="btn" id="bSave">حفظ ملف</button>
    <label class="btn">فتح ملف<input type="file" id="fJson" accept=".json,application/json" hidden></label>
    <button class="btn" id="bPng">تصدير صورة</button>
    <button class="btn" id="bCsv">جدول المساحات CSV</button>
    <button class="btn" id="bExample">المثال</button>
    <button class="btn dng" id="bNew">مخطط جديد</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
    <div class="zoom">
      <button class="btn" id="zIn" title="تكبير">+</button>
      <button class="btn" id="zOut" title="تصغير">−</button>
      <button class="btn" id="zFit" title="ملاءمة" style="font-size:13px">⤢</button>
    </div>
    <div class="legend">
      <div><i style="background:#2b2f36"></i>عمود (مثبّت)</div>
      <div><i style="background:none;border:1.5px dashed #c62828"></i>تعارض</div>
      <div><i style="background:none;border:1.5px dashed #0f6e5c"></i>حدود البناء</div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <aside>
    <div class="tabs">
      <button data-tab="props" class="on">الخصائص</button>
      <button data-tab="sched">المساحات</button>
      <button data-tab="check">التحقق والاقتراحات<span class="badge" id="issBadge" hidden>0</span></button>
      <button data-tab="auto">ترتيب تلقائي</button>
      <button data-tab="vars">البدائل</button>
      <button data-tab="set">الإعدادات</button>
    </div>
    <div class="pane on" id="p-props"></div>
    <div class="pane" id="p-sched"></div>
    <div class="pane" id="p-check"></div>
    <div class="pane" id="p-auto"></div>
    <div class="pane" id="p-vars"></div>
    <div class="pane" id="p-set"></div>
  </aside>
</main>
<footer>
  <span>الموقع: <b id="stPos">–</b></span>
  <span>المقياس: <b id="stScale">–</b></span>
  <span id="stHint">انقر غرفة لتحديدها، اسحبها لتحريكها، واسحب المقابض لتغيير مقاساتها. الأعمدة مثبّتة.</span>
</footer>
</div>

<script>
'use strict';
/* =========================================================
   Data model — all units in meters. Origin = plot top-left,
   x to the right, y downward (as the drawing is viewed).
   Rooms hold NET (clear) dimensions; walls sit in the gaps.
   ========================================================= */
const TYPES = {
  bedroom:  {n:'غرفة نوم',            c:'#f6dcb0', minA:9,   minW:2.7},
  master:   {n:'غرفة نوم رئيسية',     c:'#f2cd94', minA:14,  minW:3.3},
  majlis:   {n:'مجلس',                c:'#d3e7c6', minA:16,  minW:3.5},
  dining:   {n:'مقلط',                c:'#e6d6ef', minA:9,   minW:2.4},
  living:   {n:'صالة',                c:'#d4e6f3', minA:12,  minW:3.0},
  kitchen:  {n:'مطبخ',                c:'#f6e6a6', minA:7,   minW:2.2, wet:true},
  bath:     {n:'حمام',                c:'#c2e2ef', minA:2.4, minW:1.2, wet:true},
  wc:       {n:'دورة مياه',           c:'#c9e7f2', minA:1.5, minW:0.9, wet:true},
  laundry:  {n:'غسيل / خدمات',        c:'#d8eef0', minA:3,   minW:1.5, wet:true},
  maid:     {n:'غرفة خادمة',          c:'#efe0cf', minA:6,   minW:2.2},
  storage:  {n:'مستودع',              c:'#e5e1da', minA:2,   minW:1.2},
  corridor: {n:'ممر',                 c:'#eeeeec', minA:0,   minW:1.0, long:true},
  stair:    {n:'درج',                 c:'#dbd4c7', minA:0,   minW:1.2, long:true, fixed:true},
  elevator: {n:'مصعد',                c:'#d2d2dc', minA:0,   minW:1.2, fixed:true},
  balcony:  {n:'بلكونة',              c:'#cfa487', minA:0,   minW:1.0, long:true, outdoor:true},
  roof:     {n:'سطح',                 c:'#e9e9e9', minA:0,   minW:0,   long:true, outdoor:true, fixed:true},
  void:     {n:'فراغ',                c:'#f3f3f1', minA:0,   minW:0},
  other:    {n:'أخرى',                c:'#ececf4', minA:0,   minW:0}
};
const DEF_SETTINGS = {grid:0.05, snapObj:true, snapGrid:true, wall:0.2, colsLocked:true, strictCols:true,
  noOverlap:false, showDims:true, showChains:true, showAxes:true, showGrid:true, showBg:true, bgOpacity:0.55};

let uid = 1; const nid = p => p + (uid++).toString(36) + Math.random().toString(36).slice(2,5);
const R = (x,y,w,h,name,type,locked) => ({id:nid('r'),x,y,w,h,name,type,locked:!!locked});
const C = (x,y,w,h) => ({id:nid('c'),x,y,w:w||0.2,h:h||0.5});

function exampleState(){
  return {
    plot:{w:14,d:25,sb:{t:2,b:3.35,l:2,r:2},lab:{t:'جار',b:'شارع عرض 15م',l:'جار',r:'جار'}},
    rooms:[
      R(2,2,10,6.45,'سطح الدور الأول','roof',true),
      R(7.55,8.45,4.45,3.1,'سطح الدور الأول','roof',true),
      R(2.15,8.65,3.6,3.6,'غرفة نوم','bedroom'),
      R(2.15,12.45,3.6,2.7,'مطبخ','kitchen'),
      R(5.95,8.65,1.4,6.5,'ممر','corridor'),
      R(7.55,11.75,1.6,1.5,'حمام','bath'),
      R(7.55,13.45,1.6,1.7,'فراغ (غير مسمى)','void'),
      R(2.15,15.35,4.6,4.0,'مجلس','majlis'),
      R(6.75,15.35,2.4,4.0,'مقلط','dining'),
      R(9.35,11.75,2.4,4.5,'درج','stair',true),
      R(9.35,16.25,2.4,1.2,'بسطة الدرج','stair',true),
      R(9.35,17.55,2.4,1.8,'مصعد','elevator',true),
      R(2.15,19.55,7.0,1.8,'بلكونة','balcony',true)
    ],
    columns:[
      C(2.05,8.75),C(4.3,8.55,0.5,0.2),C(7.45,8.75),
      C(2.05,10.6),C(2.05,12.7),C(2.05,16.1),C(2.05,19.25),
      C(7.45,11.9),C(7.45,14.7),
      C(9.25,11.9),C(11.85,11.9),C(9.25,15.75),C(11.85,15.75),
      C(9.25,17.4),C(11.85,17.4),C(9.25,19.25),C(11.85,19.25)
    ],
    bg:null, variants:[], settings:{...DEF_SETTINGS}, types:null
  };
}
function blankState(){
  const s = exampleState(); s.rooms=[]; s.columns=[]; s.variants=[]; return s;
}

/* ---------------- state, history, persistence ---------------- */
let S = load() || exampleState();
S.settings = {...DEF_SETTINGS, ...(S.settings||{})};
if(S.types) for(const k in S.types) if(TYPES[k]) Object.assign(TYPES[k], S.types[k]);
let view = {s:30, tx:0, ty:0};
let sel = null;            // {k:'room'|'col', id}
let mode = 'select';
let hist = [], fut = [];
let guides = [];           // snap guide lines while dragging
let preview = null;        // auto-layout preview rooms
let calibPts = [];
let autoResults = [];

const snap = () => JSON.stringify({plot:S.plot,rooms:S.rooms,columns:S.columns});
function pushHist(){ hist.push(snap()); if(hist.length>120) hist.shift(); fut=[]; }
function restore(str){ const o=JSON.parse(str); S.plot=o.plot; S.rooms=o.rooms; S.columns=o.columns; }
function undo(){ if(!hist.length) return; fut.push(snap()); restore(hist.pop()); afterChange(); }
function redo(){ if(!fut.length) return; hist.push(snap()); restore(fut.pop()); afterChange(); }

function save(){
  try{
    const types={}; for(const k in TYPES) types[k]={minA:TYPES[k].minA,minW:TYPES[k].minW};
    S.types=types;
    localStorage.setItem('fpe-v1', JSON.stringify({...S,bg:null}));
    if(S.bg) { try{ localStorage.setItem('fpe-v1-bg', JSON.stringify(S.bg)); }catch(e){} }
    else localStorage.removeItem('fpe-v1-bg');
  }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem('fpe-v1')||'null'); if(!s) return null;
    try{ s.bg = JSON.parse(localStorage.getItem('fpe-v1-bg')||'null'); }catch(e){ s.bg=null; }
    s.variants = s.variants||[];
    return s;
  }catch(e){ return null; }
}

/* ---------------- geometry helpers ---------------- */
const EPS = 1e-6;
const f2 = v => (Math.round(v*100)/100).toFixed(2);
const r2 = v => Math.round(v*100)/100;
const area = r => r.w*r.h;
const env = () => ({x:S.plot.sb.l, y:S.plot.sb.t, w:S.plot.w-S.plot.sb.l-S.plot.sb.r, h:S.plot.d-S.plot.sb.t-S.plot.sb.b});
function inter(a,b){ const x=Math.max(a.x,b.x), y=Math.max(a.y,b.y), X=Math.min(a.x+a.w,b.x+b.w), Y=Math.min(a.y+a.h,b.y+b.h); return (X-x>0.01&&Y-y>0.01)?{x,y,w:X-x,h:Y-y}:null; }
const inside = (px,py,r,m=0) => px>r.x+m && px<r.x+r.w-m && py>r.y+m && py<r.y+r.h-m;
const colRect = c => ({x:c.x-c.w/2, y:c.y-c.h/2, w:c.w, h:c.h});
const grow = (r,d) => ({x:r.x-d,y:r.y-d,w:r.w+2*d,h:r.h+2*d});
const roomById = id => S.rooms.find(r=>r.id===id);
const colById = id => S.columns.find(c=>c.id===id);
function colsInside(r){ return S.columns.filter(c=>inside(c.x,c.y,r,0.02)); }
function esc(s){ return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function typeOf(r){ return TYPES[r.type]||TYPES.other; }

/* Structural axes: cluster column centers */
function axes(){
  const cl = (vals)=>{ vals=[...vals].sort((a,b)=>a-b); const out=[]; for(const v of vals){ const l=out[out.length-1]; if(l && v-l.v/l.n<0.3){l.v+=v;l.n++;} else out.push({v,n:1}); } return out.map(o=>o.v/o.n); };
  const xs = cl(S.columns.map(c=>c.x)), ys = cl(S.columns.map(c=>c.y));
  return {xs, ys};
}
const AXL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

/* Decompose (union of base rects) minus (obstacles) into rectangles. */
function freeRects(base, obst, minDim=0.5){
  const ysS = new Set(); for(const r of [...base,...obst]){ ysS.add(r2(r.y)); ysS.add(r2(r.y+r.h)); }
  const ys=[...ysS].sort((a,b)=>a-b);
  const bands=[];
  for(let i=0;i<ys.length-1;i++){
    const y0=ys[i], y1=ys[i+1]; if(y1-y0<0.005) continue; const ym=(y0+y1)/2;
    let ints = base.filter(r=>r.y<ym&&r.y+r.h>ym).map(r=>[r2(r.x),r2(r.x+r.w)]).sort((a,b)=>a[0]-b[0]);
    const u=[]; for(const iv of ints){ const l=u[u.length-1]; if(l&&iv[0]<=l[1]+0.005) l[1]=Math.max(l[1],iv[1]); else u.push([...iv]); }
    let cur=u;
    for(const o of obst.filter(r=>r.y<ym&&r.y+r.h>ym)){
      const a=r2(o.x), b=r2(o.x+o.w), nx=[];
      for(const [p,q] of cur){ if(b<=p||a>=q){nx.push([p,q]);continue;} if(a>p) nx.push([p,a]); if(b<q) nx.push([b,q]); }
      cur=nx;
    }
    bands.push({y0,y1,ints:cur.filter(([p,q])=>q-p>0.005)});
  }
  const rects=[]; let open=new Map();
  for(const b of bands){
    const nxt=new Map();
    for(const [p,q] of b.ints){
      const k=p+'|'+q, o=open.get(k);
      if(o && Math.abs(o.y1-b.y0)<0.005){ o.y1=b.y1; nxt.set(k,o); open.delete(k); }
      else nxt.set(k,{x0:p,x1:q,y0:b.y0,y1:b.y1});
    }
    for(const o of open.values()) rects.push(o);
    open=nxt;
  }
  for(const o of open.values()) rects.push(o);
  return rects.map(o=>({x:o.x0,y:o.y0,w:o.x1-o.x0,h:o.y1-o.y0})).filter(r=>r.w>=minDim&&r.h>=minDim);
}

function handlePts(r){ const X=r.x,Y=r.y,W=r.w,H=r.h; return [['nw',X,Y],['n',X+W/2,Y],['ne',X+W,Y],['e',X+W,Y+H/2],['se',X+W,Y+H],['s',X+W/2,Y+H],['sw',X,Y+H],['w',X,Y+H/2]]; }

function dimLine(x1,y1,x2,y2,val,fs,col='#c62828',off=0){

function chains(rooms, fs, AX){

  const merge = (arr)=>{ arr=[...new Set(arr.map(r2))].sort((a,b)=>a-b); const o=[]; for(const v of arr){ if(o.length && v-o[o.length-1] < S.settings.wall+0.06) o[o.length-1]=(o[o.length-1]+v)/2; else o.push(v);} return o; };
  const chain=(pts,fixed,horiz,col)=>{ let s=''; for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; if(b-a<0.3) continue; s+= horiz?dimLine(a,fixed,b,fixed,f2(b-a),fs,col):dimLine(fixed,a,fixed,b,f2(b-a),fs,col);} return s; };

function selDims(r, fs, rooms){

/* ---------------- conflict detection (fast, for live highlighting) ---------------- */
function conflictMap(rooms){
  const m={}, E=env();
  for(let i=0;i<rooms.length;i++){
    const a=rooms[i];
    if(S.columns.some(c=>inside(c.x,c.y,a,0.02))) m[a.id]=1;
    if(a.x<E.x-0.01||a.y<E.y-0.01||a.x+a.w>E.x+E.w+0.01||a.y+a.h>E.y+E.h+0.01) m[a.id]=1;
    for(let j=i+1;j<rooms.length;j++){ const b=rooms[j]; if(a.type!=='roof' && b.type!=='roof' && inter(a,b)){ m[a.id]=1; m[b.id]=1; } }
  }

}

/* ---------------- snapping ---------------- */
function targets(axis, exclude){
  const t=[], st=S.settings, w=st.wall, E=env();
  if(axis==='x'){ t.push(E.x,E.x+E.w,0,S.plot.w,E.x+w,E.x+E.w-w); }
  else { t.push(E.y,E.y+E.h,0,S.plot.d,E.y+w,E.y+E.h-w); }
  for(const c of S.columns){ const v=axis==='x'?c.x:c.y, d=(axis==='x'?c.w:c.h)/2; t.push(v, v-d, v+d, v-w/2, v+w/2); }
  for(const r of S.rooms){ if(r.id===exclude) continue; const a=axis==='x'?r.x:r.y, b=a+(axis==='x'?r.w:r.h); t.push(a,b,a-w,b+w); }
  return t;
}
function snapEdge(v, axis, exclude){
  const st=S.settings, thr = 9/view.s;
  if(st.snapObj){ let best=null, bd=thr; for(const t of targets(axis,exclude)){ const d=Math.abs(t-v); if(d<bd){bd=d;best=t;} } if(best!==null) return {v:best, snapped:true}; }
  if(st.snapGrid){ const g=st.grid; return {v:Math.round(v/g)*g, snapped:false}; }
  return {v, snapped:false};
}
// snap a moving rect: choose the edge with the smallest correction per axis
function snapMove(r, exclude){
  guides=[]; const res={...r};
  for(const ax of ['x','y']){
    const a = ax==='x'?r.x:r.y, len = ax==='x'?r.w:r.h;
    const s1=snapEdge(a,ax,exclude), s2=snapEdge(a+len,ax,exclude);
    let pick;
    if(s1.snapped && (!s2.snapped || Math.abs(s1.v-a)<=Math.abs(s2.v-a-len))) pick={v:s1.v, g:s1.v};
    else if(s2.snapped) pick={v:s2.v-len, g:s2.v};
    else pick={v:s1.v};
    res[ax]=r2(pick.v);
    if(pick.g!==undefined) guides.push(ax==='x'?`M${pick.g} -1V${S.plot.d+1}`:`M-1 ${pick.g}H${S.plot.w+1}`);
  }
  return res;
}
function snapPoint(x,y,exclude){
  guides=[]; const sx=snapEdge(x,'x',exclude), sy=snapEdge(y,'y',exclude);
  if(sx.snapped) guides.push(`M${sx.v} -1V${S.plot.d+1}`); if(sy.snapped) guides.push(`M-1 ${sy.v}H${S.plot.w+1}`);
  return {x:r2(sx.v), y:r2(sy.v)};
}
function validRect(r, id){
  const st=S.settings;

document.addEventListener('keydown', e=>{

function dupSel(){

function splitSel(dir){
  const r=roomById(sel.id); if(!r) return; const w=S.settings.wall, AX=axes();
  const vert = dir ? dir==='v' : r.w>=r.h;

  const cand = (vert?AX.xs:AX.ys).filter(a=>a>(vert?r.x:r.y)+1 && a<(vert?r.x+r.w:r.y+r.h)-1);
  if(cand.length){ const c=cand.reduce((b,a)=>Math.abs(a-cut)<Math.abs(b-cut)?a:b); if(Math.abs(c-cut)<(vert?r.w:r.h)*0.25) cut=c; }

  if(vert){ a.w=r2(cut-w/2-r.x); b.x=r2(cut+w/2); b.w=r2(r.x+r.w-b.x); }
  else { a.h=r2(cut-w/2-r.y); b.y=r2(cut+w/2); b.h=r2(r.y+r.h-b.y); }

function metrics(rooms){
  const w=S.settings.wall, closed=rooms.filter(r=>!typeOf(r).outdoor), open=rooms.filter(r=>typeOf(r).outdoor && r.type!=='roof');
  const net=closed.reduce((s,r)=>s+area(r),0), opn=open.reduce((s,r)=>s+area(r),0);
  const gross=unionArea(closed.map(r=>grow(r,w/2)));
  const E=env(), plotA=S.plot.w*S.plot.d;
  return {net,opn,gross,plotA,envA:E.w*E.h,cov:gross/plotA*100,walls:gross-net};
}

/* ---------------- analysis & suggestions ---------------- */
function analyze(){
  const out=[], rooms=S.rooms, E=env(), w=S.settings.wall, nm=r=>`«${r.name}»`;
  const blocked=(n,id)=> S.columns.some(c=>inside(c.x,c.y,n,0.02)) || rooms.some(o=>o.id!==id && o.type!=='roof' && inter(o,grow(n,Math.max(0,w-0.02)))) || n.x<E.x-0.01||n.y<E.y-0.01||n.x+n.w>E.x+E.w+0.01||n.y+n.h>E.y+E.h+0.01;
  // 1 columns inside rooms
  for(const r of rooms) for(const c of colsInside(r)){
    const cr=colRect(c), opts=[
      {n:{...r,w:r2(cr.x-r.x)}, d:'تقليص الجهة اليمنى إلى وجه العمود'},
      {n:{...r,x:r2(cr.x+cr.w),w:r2(r.x+r.w-cr.x-cr.w)}, d:'تقليص الجهة اليسرى إلى وجه العمود'},
      {n:{...r,h:r2(cr.y-r.y)}, d:'تقليص الجهة السفلية إلى وجه العمود'},
      {n:{...r,y:r2(cr.y+cr.h),h:r2(r.y+r.h-cr.y-cr.h)}, d:'تقليص الجهة العلوية إلى وجه العمود'}
    ].filter(o=>o.n.w>=0.5&&o.n.h>=0.5).sort((a,b)=>area(b.n)-area(a.n));
    const o=opts[0];
    out.push({lvl:'err',id:r.id,txt:`عمود عند (${f2(c.x)}، ${f2(c.y)}) يقع داخل فراغ ${nm(r)}.`+(o?` الاقتراح: ${o.d} (المساحة تصبح ${f2(area(o.n))} م² بدلاً من ${f2(area(r))}).`:''),fix:o&&!r.locked?()=>Object.assign(roomById(r.id),o.n):null});
  }
  // 2 overlaps
  for(let i=0;i<rooms.length;i++) for(let j=i+1;j<rooms.length;j++){
    const a=rooms[i], b=rooms[j]; if(a.type==='roof'||b.type==='roof') continue; const ix=inter(a,b); if(!ix) continue;
    let m = (!a.locked && (b.locked || area(a)<=area(b))) ? a : (!b.locked ? b : null), o = m===a?b:a;
    let fix=null, d='';
    if(m){
      const n={...m};
      if(ix.w<=ix.h){ if(m.x+m.w/2 < o.x+o.w/2){ n.w=r2(o.x-w-m.x); } else { const nx=r2(o.x+o.w+w); n.w=r2(m.x+m.w-nx); n.x=nx; } }
      else { if(m.y+m.h/2 < o.y+o.h/2){ n.h=r2(o.y-w-m.y); } else { const ny=r2(o.y+o.h+w); n.h=r2(m.y+m.h-ny); n.y=ny; } }
      if(n.w>=0.5&&n.h>=0.5){ fix=()=>Object.assign(roomById(m.id),n); d=` الاقتراح: تعديل ${nm(m)} إلى ${f2(n.w)} × ${f2(n.h)} مع ترك جدار ${f2(w)} م.`; }
    }
    out.push({lvl:'err',id:a.id,txt:`تداخل بين ${nm(a)} و${nm(b)} بمساحة ${f2(area(ix))} م².`+d,fix});
  }
  // 3 outside envelope
  for(const r of rooms){
    if(r.x<E.x-0.01||r.y<E.y-0.01||r.x+r.w>E.x+E.w+0.01||r.y+r.h>E.y+E.h+0.01){
      const x0=Math.max(r.x,E.x), y0=Math.max(r.y,E.y), x1=Math.min(r.x+r.w,E.x+E.w), y1=Math.min(r.y+r.h,E.y+E.h);
      const n={...r,x:r2(x0),y:r2(y0),w:r2(x1-x0),h:r2(y1-y0)};
      out.push({lvl:'err',id:r.id,txt:`${nm(r)} يتجاوز حدود البناء (الارتدادات).`+(n.w>0.3&&n.h>0.3?` الاقتراح: قصّه إلى ${f2(n.w)} × ${f2(n.h)}.`:''),fix:(n.w>0.3&&n.h>0.3&&!r.locked)?()=>Object.assign(roomById(r.id),n):null});
    }
  }
  // 4 minimum sizes
  for(const r of rooms){
    const T=typeOf(r), a=area(r), mn=Math.min(r.w,r.h);
    if((T.minA && a < T.minA-0.01) || (T.minW && mn < T.minW-0.01)){
      // try to grow into free space
      let fix=null, d='';
      if(!r.locked){
        const needA = Math.max(0,T.minA-a);
        const tries=[];
        for(const dir of ['l','r','t','b']){
          for(let s=0.05;s<=4.001;s+=0.05){
            const n={...r}; if(dir==='l'){n.x-=s;n.w+=s;} if(dir==='r'){n.w+=s;} if(dir==='t'){n.y-=s;n.h+=s;} if(dir==='b'){n.h+=s;}
            if(blocked(n,r.id)) break;
            if(area(n)>=T.minA-0.01 && Math.min(n.w,n.h)>=T.minW-0.01){ tries.push({n,s,dir}); break; }
          }
        }
        tries.sort((p,q)=>p.s-q.s);
        if(tries[0]){ const n=tries[0].n; ['x','y','w','h'].forEach(k=>n[k]=r2(n[k])); fix=()=>Object.assign(roomById(r.id),n); d=` الاقتراح: توسعة ${f2(tries[0].s)} م ${({l:'يساراً',r:'يميناً',t:'للأعلى',b:'للأسفل'})[tries[0].dir]} في مساحة فارغة.`; }
        else d=' لا توجد مساحة فارغة مجاورة كافية؛ يُقترح إعادة توزيع الغرف المجاورة أو استخدام الترتيب التلقائي.';
      }
      out.push({lvl:'warn',id:r.id,txt:`${nm(r)} أقل من الحد الإرشادي (${f2(a)} م²، أقل بُعد ${f2(mn)} م؛ الإرشادي ${f2(T.minA)} م² و${f2(T.minW)} م).`+d,fix});
    }
  }
  // 5 edges close to (not on) a column face line → align
  for(const r of rooms){
    if(r.locked) continue;
    // only columns that sit along the edge being tested (a wall line through the column)
    const near=S.columns.filter(c=>c.x>r.x-0.6&&c.x<r.x+r.w+0.6&&c.y>r.y-0.6&&c.y<r.y+r.h+0.6);
    const AXs=near.flatMap(c=>[c.x-w/2,c.x+w/2]), AYs=near.flatMap(c=>[c.y-w/2,c.y+w/2]);
    const edges=[['x',r.x,'l'],['x',r.x+r.w,'r'],['y',r.y,'t'],['y',r.y+r.h,'b']];
    for(const [ax,v,side] of edges){
      const list=ax==='x'?AXs:AYs; let best=null,bd=0.26;
      for(const t of list){ const d=Math.abs(t-v); if(d>0.04 && d<bd){bd=d;best=t;} }
      if(best===null) continue;
      if(list.some(t=>Math.abs(t-v)<=0.04)) continue;
      const n={...r}; if(side==='l'){n.w=r2(r.x+r.w-best);n.x=r2(best);} if(side==='r') n.w=r2(best-r.x); if(side==='t'){n.h=r2(r.y+r.h-best);n.y=r2(best);} if(side==='b') n.h=r2(best-r.y);
      if(blocked(n,r.id)) continue;
      out.push({lvl:'info',id:r.id,txt:`حافة ${nm(r)} ${({l:'اليسرى',r:'اليمنى',t:'العلوية',b:'السفلية'})[side]} تبعد ${f2(bd)} م عن خط العمود. الاقتراح: محاذاتها ليمر الجدار على العمود (المساحة ${f2(area(n))} م²).`,fix:()=>Object.assign(roomById(r.id),n)});
    }
  }
  // 6 slivers (gaps wider than a wall but too narrow to use)
  for(const r of rooms){
    if(r.locked) continue;
    for(const o of rooms){
      if(o.id===r.id) continue;
      const ovY=Math.min(r.y+r.h,o.y+o.h)-Math.max(r.y,o.y), ovX=Math.min(r.x+r.w,o.x+o.w)-Math.max(r.x,o.x);
      let g=null,n=null;
      if(ovY>0.5 && o.x>=r.x+r.w){ g=o.x-(r.x+r.w); n={...r,w:r2(o.x-w-r.x)}; }
      else if(ovX>0.5 && o.y>=r.y+r.h){ g=o.y-(r.y+r.h); n={...r,h:r2(o.y-w-r.y)}; }
      if(g!==null && g>w+0.04 && g<0.7 && !blocked(n,r.id))
        out.push({lvl:'info',id:r.id,txt:`فراغ ضيق غير مستغل بعرض ${f2(g)} م بين ${nm(r)} و${nm(o)}. الاقتراح: توسعة ${nm(r)} ليبقى جدار ${f2(w)} م فقط (+${f2(area(n)-area(r))} م²).`,fix:()=>Object.assign(roomById(r.id),n)});
    }
  }
  // rooms built over a roof area
  for(const rf of rooms.filter(x=>x.type==='roof')) for(const r of rooms){ if(r.type==='roof') continue; const ix=inter(rf,r); if(ix) out.push({lvl:'info',id:r.id,txt:`«${r.name}» مقام على مساحة ${nm(rf)} (${f2(area(ix))} م²)، أي إضافة بناء على السطح.`}); }
  // 7 proportions
  for(const r of rooms){ const T=typeOf(r); if(T.long) continue; const q=Math.max(r.w,r.h)/Math.min(r.w,r.h); if(q>2.2) out.push({lvl:'info',id:r.id,txt:`${nm(r)} مستطيل جداً (نسبة ${f2(q)}:1). يُفضّل ألا تتجاوز 2:1 للغرف المعيشية.`}); }
  return out;
}

/* ---------------- automatic layout ---------------- */
let autoCfg={region:'footprint', n:4, wet:true};
function rng(seed){ return ()=>{ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }; }
function slice(rect, items, AX, rand, out, cuts){
  if(!items.length) return;
  if(items.length===1){ out.push({it:items[0],r:rect}); return; }
  const tot=items.reduce((s,i)=>s+i.t,0);
  let vert = rect.w>=rect.h; if(rand()<0.22) vert=!vert;
  const L = vert?rect.w:rect.h;
  // candidate split indices
  let acc=0, cands=[];
  for(let k=1;k<items.length;k++){ acc+=items[k-1].t; cands.push({k,ratio:acc/tot}); }
  cands.sort((a,b)=>Math.abs(a.ratio-0.5)-Math.abs(b.ratio-0.5));
  const c = cands[rand()<0.7?0:Math.min(cands.length-1,1+Math.floor(rand()*2))];
  let cut = (vert?rect.x:rect.y) + L*c.ratio;
  const base=vert?rect.x:rect.y, axs=(vert?AX.xs:AX.ys).filter(a=>a>base+1.0 && a<base+L-1.0);
  let snappedCol=false;
  if(axs.length){ const near=axs.reduce((b,a)=>Math.abs(a-cut)<Math.abs(b-cut)?a:b); if(Math.abs(near-cut) < Math.max(0.5, L*0.14)){ cut=near; snappedCol=true; } }
  if(!snappedCol) cut=Math.round(cut/0.05)*0.05;
  cut=Math.min(base+L-0.6, Math.max(base+0.6, cut));
  cuts.n++; if(snappedCol) cuts.col++;
  const A=items.slice(0,c.k), B=items.slice(c.k);
  const ra = vert?{x:rect.x,y:rect.y,w:cut-rect.x,h:rect.h}:{x:rect.x,y:rect.y,w:rect.w,h:cut-rect.y};
  const rb = vert?{x:cut,y:rect.y,w:rect.x+rect.w-cut,h:rect.h}:{x:rect.x,y:cut,w:rect.w,h:rect.y+rect.h-cut};
  slice(ra,A,AX,rand,out,cuts); slice(rb,B,AX,rand,out,cuts);
}
function autoLayout(itemsIn){
  const w=S.settings.wall, hw=w/2, E=env(), AX=axes();
  const fixed=S.rooms.filter(r=>r.locked || !itemsIn.find(i=>i.id===r.id));
  let base;
  if(autoCfg.region==='footprint') base=itemsIn.map(i=>grow(roomById(i.id),hw));
  else base=[{x:E.x+hw,y:E.y+hw,w:E.w-w,h:E.h-w}];
  const obst=fixed.map(r=>grow(r,hw));
  const free=freeRects(base,obst,1.0);
  if(!free.length) return [];
  const freeA=free.reduce((s,r)=>s+area(r),0);
  const results=[], seen=new Set();
  for(let seed=1; seed<=500; seed++){
    const rand=rng(seed*7919+13);
    let items=itemsIn.map(i=>({...i}));
    // shuffle with bias (keep some order variety)
    for(let i=items.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
    if(autoCfg.wet && rand()<0.7){ items.sort((a,b)=>(TYPES[b.type]?.wet?1:0)-(TYPES[a.type]?.wet?1:0)); if(rand()<0.5) items.reverse(); }
    // distribute items over free rects proportionally to area
    const bins=free.map(r=>({r,cap:area(r),items:[],sum:0}));
    const totT=items.reduce((s,i)=>s+i.t,0), k=freeA/totT;
    for(const it of [...items].sort((a,b)=>b.t-a.t + (rand()-0.5)*2)){
      const b=bins.reduce((best,x)=> (x.cap-x.sum-it.t*k) > (best.cap-best.sum-it.t*k) ? x : best);
      b.items.push(it); b.sum+=it.t*k;
    }
    // restore shuffled order inside each bin
    for(const b of bins) b.items.sort((p,q)=>items.indexOf(p)-items.indexOf(q));
    const out=[], cuts={n:0,col:0};
    for(const b of bins) slice(b.r,b.items,AX,rand,out,cuts);
    const rooms=out.map(o=>({...roomById(o.it.id), x:r2(o.r.x+hw), y:r2(o.r.y+hw), w:r2(o.r.w-w), h:r2(o.r.h-w)}));
    if(rooms.length!==items.length || rooms.some(r=>r.w<0.6||r.h<0.6)) continue;
    // score
    let sc=0;
    for(const r of rooms){
      const it=itemsIn.find(i=>i.id===r.id), T=typeOf(r), a=area(r);
      sc += Math.abs(a-it.t*k)/Math.max(1,it.t*k)*4;
      const q=Math.max(r.w,r.h)/Math.min(r.w,r.h); if(!T.long) sc+=Math.max(0,q-1.8)*2.5;
      if(T.minW && Math.min(r.w,r.h)<T.minW) sc+=(T.minW-Math.min(r.w,r.h))*6;
      if(T.minA && a<T.minA) sc+=(T.minA-a)/T.minA*5;
      sc += colsInside(r).length*12;
    }
    if(autoCfg.wet){ const wets=rooms.filter(r=>typeOf(r).wet); for(let i=0;i<wets.length;i++) for(let j=i+1;j<wets.length;j++){ if(inter(grow(wets[i],w*0.6),grow(wets[j],w*0.6))) sc-=1.2; } }
    sc -= cuts.col*0.4;
    const sig=rooms.map(r=>[r.id,Math.round(r.x*2),Math.round(r.y*2),Math.round(r.w*2)].join()).sort().join('|');
    if(seen.has(sig)) continue; seen.add(sig);
    results.push({rooms, score:sc, colCuts:cuts.col, cuts:cuts.n, unused:freeA-rooms.reduce((s,r)=>s+(r.w+w)*(r.h+w),0)});
  }
  results.sort((a,b)=>a.score-b.score);
  return results.slice(0,autoCfg.n);
}
function showAuto(){
  const p=$('#p-auto'); const cand=S.rooms.filter(r=>!r.locked && !typeOf(r).fixed);
  p.innerHTML=`<div class="hint">يعيد توزيع الغرف غير المقفلة داخل المساحة المحددة، مع تثبيت الأعمدة والغرف المقفلة (الدرج، المصعد، البلكونة، الأسطح…). خطوط التقسيم تُحاذى مع محاور الأعمدة كلما أمكن، ويُترك جدار ${f2(S.settings.wall)} م بين الغرف.</div>
  <h3>المساحة المتاحة</h3>
  <label class="chk"><input type="radio" name="reg" value="footprint" ${autoCfg.region==='footprint'?'checked':''}> نفس البصمة الحالية للغرف (لا يتغير الشكل الخارجي)</label>
  <label class="chk"><input type="radio" name="reg" value="envelope" ${autoCfg.region==='envelope'?'checked':''}> كامل حدود البناء ناقص الغرف المقفلة</label>
  <label class="chk"><input type="checkbox" id="aWet" ${autoCfg.wet?'checked':''}> تجميع المناطق الرطبة (مطبخ/حمام/غسيل) لتقليل التمديدات</label>
  <h3>الغرف المشمولة والمساحة المستهدفة</h3>
  <table><thead><tr><th></th><th>الغرفة</th><th>الحالية</th><th>المستهدفة م²</th></tr></thead><tbody>
  ${cand.map(r=>`<tr><td><input type="checkbox" class="aInc" data-id="${r.id}" checked></td><td>${esc(r.name)}</td><td class="n">${f2(area(r))}</td><td><input type="number" class="aT" data-id="${r.id}" value="${f2(r.target||area(r))}" step="0.5" min="1" style="width:80px"></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد غرف غير مقفلة</td></tr>'}
  </tbody></table>
  <div class="row"><button class="btn pri" id="aRun" ${cand.length?'':'disabled'}>توليد بدائل</button>${preview?'<button class="btn" id="aCancel">إلغاء المعاينة</button>':''}</div>
  <div class="cards" id="aRes"></div>
  <p class="hint">المساحات المستهدفة تُعامل كنِسَب؛ تُكبَّر أو تُصغَّر بالتناسب لتملأ المساحة المتاحة. الترتيب المقترح مبدئي ويُراجع للأبواب والفتحات والحركة.</p>`;
  p.querySelectorAll('input[name=reg]').forEach(i=>i.onchange=()=>autoCfg.region=i.value);
  $('#aWet').onchange=e=>autoCfg.wet=e.target.checked;
  p.querySelectorAll('.aT').forEach(i=>i.onchange=()=>{ const r=roomById(i.dataset.id); r.target=parseFloat(i.value)||area(r); save(); });
  if($('#aCancel')) $('#aCancel').onclick=()=>{ preview=null; render(); showAuto(); };
  $('#aRun').onclick=()=>{
    const items=[...p.querySelectorAll('.aInc')].filter(i=>i.checked).map(i=>{ const r=roomById(i.dataset.id); const t=parseFloat(p.querySelector(`.aT[data-id="${r.id}"]`).value)||area(r); return {id:r.id,t,type:r.type}; });
    if(items.length<2){ toast('اختر غرفتين على الأقل.'); return; }
    autoResults=autoLayout(items);
    if(!autoResults.length){ toast('تعذر توليد بدائل؛ جرّب «كامل حدود البناء» أو ألغِ قفل بعض الغرف.'); return; }
    drawAutoCards();
  };
  if(autoResults.length) drawAutoCards();
}
function miniSvg(rooms){
  const E=env(), m=0.6, vb=`${E.x-m} ${E.y-m} ${E.w+2*m} ${E.h+2*m}`;
  const all=S.rooms.map(r=>rooms.find(x=>x.id===r.id)||r);
  const sv=view.s; view.s=Math.min(260/(E.w+2*m), 340/(E.h+2*m))*0.9;
  const st={...S.settings}; S.settings.showChains=false;
  const h=drawPlan({rooms:all,interactive:false}); S.settings=st; view.s=sv;
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="hatch2" width="0.35" height="0.35" patternUnits="userSpaceOnUse"><rect width=".35" height=".35" fill="#eee"/></pattern></defs>${h.replaceAll('url(#hatch)','url(#hatch2)')}</svg>`;
}
function drawAutoCards(){
  const box=$('#aRes'); if(!box) return;
  box.innerHTML=autoResults.map((res,i)=>`<div class="card ${preview&&preview._i===i?'on':''}" data-i="${i}">${miniSvg(res.rooms)}<div class="meta">البديل ${i+1} · تقييم ${f2(Math.max(0,100-res.score*4))}/100<br>${res.colCuts}/${res.cuts} خطوط على محاور الأعمدة</div><div class="row"><button class="btn sm" data-pv="${i}">معاينة</button><button class="btn sm pri" data-ap="${i}">اعتماد</button><button class="btn sm" data-sv="${i}">حفظ كبديل</button></div></div>`).join('');
  const roomsOf=i=>S.rooms.map(r=>{ const x=autoResults[i].rooms.find(q=>q.id===r.id); return x?{...r,x:x.x,y:x.y,w:x.w,h:x.h}:r; });
  box.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.pv; preview=roomsOf(i); preview._i=i; render(); showAuto(); toast('معاينة فقط — اضغط «اعتماد» للتطبيق أو Esc للإلغاء.'); });
  box.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{ pushHist(); S.rooms=roomsOf(+b.dataset.ap); preview=null; afterChange(); toast('تم اعتماد البديل. يمكنك التراجع بـ ↶'); });
  box.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.sv; S.variants.push({id:nid('v'),name:'ترتيب تلقائي '+(i+1),rooms:JSON.parse(JSON.stringify(roomsOf(i))),at:Date.now()}); save(); toast('حُفظ في تبويب «البدائل».'); });
}

/* ---------------- variants ---------------- */
function showVars(){
  const p=$('#p-vars'), V=S.variants;
  const names=[...new Set(S.rooms.filter(r=>r.type!=='roof').map(r=>r.name))];
  const areaOf=(rooms,n)=>{ const a=rooms.filter(r=>r.name===n).reduce((s,r)=>s+area(r),0); return a?f2(a):'–'; };
  p.innerHTML=`<div class="hint">احفظ المخطط الحالي كبديل لمقارنة اقتراحات التعديل. الأعمدة واحدة في جميع البدائل.</div>
  <div class="row"><input type="text" id="vName" placeholder="اسم البديل (مثلاً: توسعة المطبخ)" style="flex:1"><button class="btn pri sm" id="vAdd">حفظ الحالي</button></div>
  ${V.length?`<table><thead><tr><th>البديل</th><th>صافي م²</th><th></th></tr></thead><tbody>${V.map((v,i)=>`<tr><td>${esc(v.name)}</td><td class="n">${f2(metrics(v.rooms).net)}</td><td style="white-space:nowrap"><button class="btn sm" data-ld="${i}">فتح</button> <button class="btn sm dng" data-dl="${i}">×</button></td></tr>`).join('')}</tbody></table>
  <h3>مقارنة المساحات (م²)</h3>
  <div style="overflow-x:auto"><table><thead><tr><th>الفراغ</th><th>الحالي</th>${V.map(v=>`<th>${esc(v.name)}</th>`).join('')}</tr></thead><tbody>
  ${names.map(n=>`<tr><td>${esc(n)}</td><td class="n">${areaOf(S.rooms,n)}</td>${V.map(v=>`<td class="n">${areaOf(v.rooms,n)}</td>`).join('')}</tr>`).join('')}
  <tr><td><b>الصافي</b></td><td class="n"><b>${f2(metrics(S.rooms).net)}</b></td>${V.map(v=>`<td class="n"><b>${f2(metrics(v.rooms).net)}</b></td>`).join('')}</tr>
  </tbody></table></div>`:'<div class="empty">لا توجد بدائل محفوظة بعد.</div>'}`;
  $('#vAdd').onclick=()=>{ S.variants.push({id:nid('v'),name:$('#vName').value.trim()||('بديل '+(V.length+1)),rooms:JSON.parse(JSON.stringify(S.rooms)),at:Date.now()}); save(); showVars(); };
  p.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{ pushHist(); S.rooms=JSON.parse(JSON.stringify(V[+b.dataset.ld].rooms)); sel=null; afterChange(); toast('تم فتح البديل. يمكنك التراجع بـ ↶'); });
  p.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{ confirmBox('حذف هذا البديل؟','حذف').then(ok=>{ if(ok){ V.splice(+b.dataset.dl,1); save(); showVars(); } }) });
}

/* ---------------- settings ---------------- */
function showSet(){
  const st=S.settings, p=$('#p-set');
  const ck=(k,t)=>`<label class="chk"><input type="checkbox" data-s="${k}" ${st[k]?'checked':''}> ${t}</label>`;
  p.innerHTML=`<h3>الأعمدة</h3>
  ${ck('colsLocked','تثبيت الأعمدة (لا يمكن تحريكها أو حذفها)')}
  ${ck('strictCols','منع أي حركة تضع عموداً داخل فراغ غرفة')}
  <h3>الالتقاط والرسم</h3>
  ${ck('snapObj','الالتقاط إلى الأعمدة والمحاور وحواف الغرف (مع ترك سماكة الجدار)')}
  ${ck('snapGrid','الالتقاط إلى الشبكة')}
  ${ck('noOverlap','منع تداخل الغرف')}
  <div class="grid2"><label class="fld"><span>خطوة الشبكة (م)</span><select data-n="grid">${[0.01,0.05,0.1,0.25,0.5].map(v=>`<option ${v===st.grid?'selected':''}>${v}</option>`).join('')}</select></label>
  <label class="fld"><span>سماكة الجدار الداخلي (م)</span><input type="number" data-n="wall" value="${st.wall}" step="0.05" min="0"></label></div>
  <h3>العرض</h3>
  ${ck('showDims','إظهار أبعاد ومساحة كل غرفة')}
  ${ck('showChains','إظهار سلاسل الأبعاد')}
  ${ck('showAxes','إظهار المحاور الإنشائية والمسافات بينها')}
  ${ck('showGrid','إظهار الشبكة')}
  ${ck('showBg','إظهار صورة المخطط')}
  <label class="fld"><span>شفافية الصورة</span><input type="range" min="0.05" max="1" step="0.05" data-n="bgOpacity" value="${st.bgOpacity}"></label>
  ${S.bg?'<div class="row"><button class="btn sm dng" id="bgDel">إزالة صورة المخطط</button></div>':''}
  <h3>الحدود الدنيا الإرشادية</h3>
  <div class="hint">قيم افتراضية للتنبيه فقط، عدّلها وفق اشتراطات جهتك.</div>
  <table class="typetbl"><thead><tr><th>النوع</th><th>أقل مساحة</th><th>أقل بُعد</th></tr></thead><tbody>
  ${Object.entries(TYPES).filter(([k])=>!['roof','void','other'].includes(k)).map(([k,t])=>`<tr><td>${t.n}</td><td><input type="number" data-t="${k}" data-f="minA" value="${t.minA}" step="0.5" min="0"></td><td><input type="number" data-t="${k}" data-f="minW" value="${t.minW}" step="0.1" min="0"></td></tr>`).join('')}
  </tbody></table>`;
  p.querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>{ st[i.dataset.s]=i.checked; afterChange(); });
  p.querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>{ st[i.dataset.n]=parseFloat(i.value); save(); render(); updateBadge(); });
  p.querySelectorAll('[data-t]').forEach(i=>i.onchange=()=>{ TYPES[i.dataset.t][i.dataset.f]=parseFloat(i.value)||0; save(); updateBadge(); });
  if($('#bgDel')) $('#bgDel').onclick=()=>{ S.bg=null; save(); render(); showSet(); };
}

/* ---------------- files ---------------- */
$('#fImg').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{
    // downscale very large images to keep the browser storage light
    let src=rd.result, iw=img.width, ih=img.height; const MAX=2400;
    if(Math.max(iw,ih)>MAX){ const k=MAX/Math.max(iw,ih), c=document.createElement('canvas'); c.width=Math.round(iw*k); c.height=Math.round(ih*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); src=c.toDataURL('image/jpeg',0.88); iw=c.width; ih=c.height; }
    const k=S.plot.w/iw; // initial guess: image width = plot width
    S.bg={src,iw,ih,k,x:0,y:0}; S.settings.showBg=true; save(); fit();
    toast('تم رفع الصورة. الخطوة التالية: «معايرة المقياس».',4000); setMode('calib');
  }; img.src=rd.result; };
  rd.readAsDataURL(f); e.target.value='';
};
function exportBox(title, name, data, type, img){
  modal(`<h4>${esc(title)}</h4>${img?`<img src="${data}" alt="${esc(name)}"><div class="hint">إن لم يبدأ التنزيل: اضغط مطولاً على الصورة أو انقر بالزر الأيمن واحفظها.</div>`:`<textarea id="mTx" readonly></textarea><div class="hint">إن لم يبدأ التنزيل: انسخ النص واحفظه في ملف باسم ${esc(name)}.</div>`}<div class="acts"><button class="btn pri" id="mDl">تنزيل ${esc(name)}</button>${img?'':'<button class="btn" id="mCp">نسخ</button>'}<button class="btn" id="mNo">إغلاق</button></div>`,(b,close)=>{
    const tx=b.querySelector('#mTx'); if(tx) tx.value=data;
    b.querySelector('#mDl').onclick=()=>{ try{ download(name,data,type); }catch(e){ toast('التنزيل غير متاح هنا؛ استخدم النسخ.'); } };
    const cp=b.querySelector('#mCp'); if(cp) cp.onclick=()=>{ navigator.clipboard.writeText(data).then(()=>toast('تم النسخ.'),()=>{ tx.focus(); tx.select(); toast('النص محدد؛ انسخه يدوياً.'); }); };
    b.querySelector('#mNo').onclick=close;
  });
}
function download(name, data, type){ const a=document.createElement('a'); a.href=typeof data==='string'&&data.startsWith('data:')?data:URL.createObjectURL(new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
$('#bSave').onclick=()=>exportBox('حفظ المخطط (JSON): الغرف والأعمدة والبدائل والصورة','مخطط.json', JSON.stringify(S), 'application/json');
$('#fJson').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const o=JSON.parse(t); if(!o.plot||!o.rooms) throw 0; pushHist(); S={...exampleState(),...o,settings:{...DEF_SETTINGS,...(o.settings||{})},variants:o.variants||[]}; sel=null; afterChange(); fit(); toast('تم فتح الملف.'); }catch(err){ toast('تعذر قراءة الملف: صيغة غير صحيحة.'); } }); e.target.value=''; };
$('#bCsv').onclick=()=>{
  const m=metrics(S.rooms), rows=[['الفراغ','النوع','العرض م','العمق م','المساحة م²','س','ص']];
  S.rooms.filter(r=>r.type!=='roof').forEach(r=>rows.push([r.name,typeOf(r).n,f2(r.w),f2(r.h),f2(area(r)),f2(r.x),f2(r.y)]));
  rows.push([],['صافي الفراغات المغلقة','','','',f2(m.net)],['المسطح الإجمالي التقديري','','','',f2(m.gross)],['المكشوف','','','',f2(m.opn)]);
  exportBox('جدول المساحات (CSV)','جدول-المساحات.csv','﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
};
$('#bPng').onclick=()=>{
  const P=S.plot, m=2.6, k=60, W=Math.round((P.w+2*m)*k), H=Math.round((P.d+2*m)*k);
  const sv={...view}, ss=sel; sel=null; view={s:k,tx:m*k,ty:m*k};
  const inner=drawPlan({rooms:S.rooms,interactive:true}); view=sv; sel=ss;
  const defs=cv.querySelector('defs').outerHTML;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" font-family="Tahoma, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/>${defs}<g transform="translate(${m*k},${m*k}) scale(${k})">${inner}</g></svg>`;
  const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(img,0,0); exportBox('صورة المخطط','مخطط.png', c.toDataURL('image/png'),'image/png',true); };
  img.onerror=()=>toast('تعذر التصدير في هذا المتصفح.');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};
$('#bExample').onclick=async()=>{ if(!await confirmBox('تحميل المثال سيستبدل الغرف والأعمدة الحالية (يمكن التراجع). متابعة؟')) return; pushHist(); const e=exampleState(); S.plot=e.plot; S.rooms=e.rooms; S.columns=e.columns; sel=null; autoResults=[]; afterChange(); fit(); };
$('#bNew').onclick=async()=>{ if(!await confirmBox('بدء مخطط جديد؟ ستُحذف الغرف والأعمدة (يمكن التراجع).','بدء جديد')) return; pushHist(); S.rooms=[]; S.columns=[]; sel=null; autoResults=[]; afterChange(); };
$('#bUndo').onclick=undo; $('#bRedo').onclick=redo;
$('#zIn').onclick=()=>{ const b=cv.getBoundingClientRect(); zoomAt(1.25,b.width/2,b.height/2); };
$('#zOut').onclick=()=>{ const b=cv.getBoundingClientRect(); zoomAt(0.8,b.width/2,b.height/2); };
$('#zFit').onclick=fit;
$('#newType').innerHTML=typeOpts('bedroom');
window.addEventListener('resize', ()=>render());

fit(); refreshPane(); updateBadge();
new ResizeObserver(()=>{ if(!fit.done){ fit(); fit.done=true; } else render(); }).observe(cv);
</script>
